[package]
name = "my-universe"
version = "0.1.0"
description = "Multi-agent novel world studio"
edition = "2021"

[lib]
name = "my_universe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
base64 = "0.23"

tungstenite = { version = "0.28", features = ["native-tls"] }
